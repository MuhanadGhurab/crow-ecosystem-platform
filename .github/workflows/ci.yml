name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  DATABASE_URL: postgresql://ci:ci@localhost:5432/crow_ci?schema=public
  DIRECT_URL: postgresql://ci:ci@localhost:5432/crow_ci?schema=public
  AUTH_DISABLED: "true"
  USE_MOCK_DATA: "false"
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit JSX sources
        run: npm run audit:src

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  postgres-smoke:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d crow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Migration status
        run: npm run db:status

      - name: Phase 1 pipeline smoke (Postgres)
        run: npm run smoke:phase1

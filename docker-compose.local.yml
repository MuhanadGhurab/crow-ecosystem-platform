# C3 local development stack — Postgres + Mailpit (localhost only).
# Usage: npm run local:services:up
services:
  postgres:
    image: postgres:16-alpine
    container_name: crow-local-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: crow
      POSTGRES_PASSWORD: crow_local_dev
      POSTGRES_DB: crow_ecosystem
    volumes:
      - crow_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crow -d crow_ecosystem"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: crow-local-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  crow_local_pgdata:
